<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student Registration Form</h2>

<form>
    Roll No:<br>
    <input type="text"><br>

    Name:<br>
    <input type="text"><br>

    Gender:<br>
    <input type="radio" name="g"> Male
    <input type="radio" name="g"> Female
    <input type="radio" name="g"> Other<br><br>

    Father Name:<br>
    <input type="text"><br>

    Date of Birth:<br>
    <input type="date"><br>

    Contact:<br>
    <input type="text"><br>

    Email:<br>
    <input type="email"><br>

    Mailing Address:<br>
    <textarea></textarea><br>

    Permanent Address:<br>
    <textarea></textarea><br>

    Course:<br>
    <select>
        <option>BCA</option>
        <option>BBA</option>
        <option>B.Tech</option>
    </select><br>

    Medium:<br>
    <select>
        <option>English</option>
        <option>Hindi</option>
    </select><br>

    <input type="submit" value="Register">
</form>

</body>
</html>
